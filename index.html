<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <!-- Ambient Backdrop & Starlight Particles Layer -->
  <div class="ambient-background" id="ambient-bg" aria-hidden="true"></div>
  <canvas class="ambient-dust-canvas" id="ambient-dust-canvas" aria-hidden="true"></canvas>

  <!-- Discreet Header Bar -->
  <header class="site-header" role="banner">
    <div class="site-header-left">
      <span class="header-site-title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L14.39 8.26L21 9.27L16.5 14.14L17.77 21L12 17.77L6.23 21L7.5 14.14L3 9.27L9.61 8.26L12 2Z"/></svg>
        A Light For Dadyy
      </span>
    </div>
    <div class="site-header-right" id="header-audio-container">
      <!-- Audio toggle button rendered only if audio.enabled in family.json -->
    </div>
  </header>

  <!-- Hidden Audio Player (silent by default, never plays unless explicitly tapped) -->
  <audio id="recitation-audio" preload="none" aria-hidden="true"></audio>

  <main>
    <!-- ====================================================================
         CHAPTER 1: The Opening
         ==================================================================== -->
    <section class="chapter" id="chapter-1" aria-label="Chapter 1: The Opening">
      <div class="chapter-inner">
        <!-- Low Glowing Lantern -->
        <div class="single-lantern-wrap" aria-hidden="true">
          <svg class="opening-lantern" viewBox="0 0 60 120">
            <defs>
              <linearGradient id="ch1-chain" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#5a4521" />
                <stop offset="100%" stop-color="#9a7638" />
              </linearGradient>
              <radialGradient id="ch1-flame-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fff5db" stop-opacity="0.9" />
                <stop offset="40%" stop-color="#e6b85c" stop-opacity="0.6" />
                <stop offset="100%" stop-color="#e6b85c" stop-opacity="0" />
              </radialGradient>
            </defs>
            <line x1="30" y1="0" x2="30" y2="40" stroke="url(#ch1-chain)" stroke-width="1.5" stroke-dasharray="3,2" />
            <!-- Cap -->
            <path d="M22 40 L38 40 L34 48 L26 48 Z" fill="#9a7638" stroke="#caa558" stroke-width="0.8" />
            <!-- Glass Body -->
            <path d="M20 48 L40 48 L36 82 L24 82 Z" fill="rgba(18, 32, 36, 0.45)" stroke="#caa558" stroke-width="1" />
            <!-- Flame & Glow -->
            <circle cx="30" cy="65" r="14" fill="url(#ch1-flame-glow)" />
            <path d="M30 58 Q32 64 30 68 Q28 64 30 58 Z" fill="#fffdf5" />
            <!-- Base -->
            <path d="M22 82 L38 82 L34 88 L26 88 Z" fill="#7a5c24" stroke="#caa558" stroke-width="0.8" />
          </svg>
        </div>

        <!-- Istirja' Verse Slot -->
        <div id="ch1-verse-container" class="verse-text-group">
          <p id="ch1-arabic" class="sacred-arabic" lang="ar" dir="rtl"></p>
          <p id="ch1-translation" class="sacred-translation"></p>
          <span id="ch1-reference" class="sacred-reference"></span>
        </div>

        <!-- Dadyy's Name and Years (rendered dynamically from family.json if present) -->
        <div id="ch1-person-identity" class="person-identity"></div>

        <!-- Continue Nav -->
        <div class="continue-nav">
          <button type="button" class="continue-btn" onclick="document.getElementById('chapter-2').scrollIntoView({behavior: 'smooth'})" aria-label="Continue to his portrait">
            <span>Continue</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59L12 13.17L16.59 8.59L18 10L12 16L6 10L7.41 8.59Z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ====================================================================
         CHAPTER 2: His Portrait
         ==================================================================== -->
    <section class="chapter" id="chapter-2" aria-label="Chapter 2: His Portrait">
      <div class="chapter-inner">
        <div class="portrait-container">
          <!-- Ambient breathing halo behind frame -->
          <div class="portrait-glow-halo" aria-hidden="true"></div>

          <!-- Mihrab Arch Frame -->
          <div class="mihrab-frame">
            <!-- Fine Khatamband geometric accents overlay SVG -->
            <svg class="mihrab-svg-border" viewBox="0 0 320 480" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="mihrab-gold-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#caa558" />
                  <stop offset="50%" stop-color="#ffdf94" />
                  <stop offset="100%" stop-color="#9a7638" />
                </linearGradient>
              </defs>
              <!-- Traditional Pointed Keel Arch Border -->
              <path d="M 18 462 L 18 170 Q 18 80 160 18 Q 302 80 302 170 L 302 462 Z"
                    stroke="url(#mihrab-gold-stroke)" stroke-width="1.8" stroke-opacity="0.85" />
              <!-- Inner Arch Trim -->
              <path d="M 24 456 L 24 172 Q 24 88 160 30 Q 296 88 296 172 L 296 456 Z"
                    stroke="url(#mihrab-gold-stroke)" stroke-width="0.8" stroke-dasharray="4,4" stroke-opacity="0.5" />
              <!-- Corner Khatamband 8-Fold Geometric Rosette - Top Left Spandrel -->
              <g transform="translate(18, 22) scale(0.18)" stroke="#caa558" stroke-width="1.5" stroke-opacity="0.6">
                <rect x="-30" y="-30" width="60" height="60" fill="none" />
                <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)" fill="none" />
                <circle cx="0" cy="0" r="14" fill="none" />
              </g>
              <!-- Corner Khatamband 8-Fold Geometric Rosette - Top Right Spandrel -->
              <g transform="translate(302, 22) scale(0.18)" stroke="#caa558" stroke-width="1.5" stroke-opacity="0.6">
                <rect x="-30" y="-30" width="60" height="60" fill="none" />
                <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)" fill="none" />
                <circle cx="0" cy="0" r="14" fill="none" />
              </g>
              <!-- Peak Finial -->
              <circle cx="160" cy="18" r="3" fill="#ffdf94" />
            </svg>

            <!-- Portrait Photo (Clean cropped, completely still, never animated) -->
            <div class="portrait-image-wrapper">
              <img id="portrait-img" src="assets/photos/dadyy.jpg" alt="Dadyy" class="portrait-img" loading="eager">
            </div>
          </div>
        </div>

        <!-- Words below the portrait (rendered dynamically from family.json if present) -->
        <div id="ch2-tribute-container" class="portrait-tribute-text">
          <p id="ch2-family-words" class="family-tribute"></p>
          <p id="ch2-kamran-quote" class="kamran-quote"></p>
        </div>

        <!-- Continue Nav -->
        <div class="continue-nav">
          <button type="button" class="continue-btn" onclick="document.getElementById('chapter-3').scrollIntoView({behavior: 'smooth'})" aria-label="Continue to what remains">
            <span>Continue</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59L12 13.17L16.59 8.59L18 10L12 16L6 10L7.41 8.59Z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ====================================================================
         CHAPTER 3: What Remains
         ==================================================================== -->
    <section class="chapter" id="chapter-3" aria-label="Chapter 3: What Remains">
      <div class="chapter-inner">
        <p class="chapter-prompt">Three things continue after a person dies. Tap each lantern to light it.</p>

        <!-- Trio of Hanging Lanterns -->
        <div class="lanterns-trio" role="region" aria-label="Three Lanterns of Enduring Deeds">
          <!-- Lantern 1: Ongoing Charity -->
          <button type="button" class="lantern-card" id="lantern-charity" aria-pressed="false" aria-label="Light lantern for ongoing charity">
            <div class="lantern-svg-wrap" aria-hidden="true">
              <svg class="lantern-svg" viewBox="0 0 80 150">
                <defs>
                  <radialGradient id="lantern-flame-1" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fff8eb" stop-opacity="1" />
                    <stop offset="40%" stop-color="#f5cf7b" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#e6b85c" stop-opacity="0" />
                  </radialGradient>
                  <radialGradient id="lantern-halo-1" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffd98c" stop-opacity="0.75" />
                    <stop offset="60%" stop-color="#caa558" stop-opacity="0.25" />
                    <stop offset="100%" stop-color="#e6b85c" stop-opacity="0" />
                  </radialGradient>
                </defs>
                <!-- Chain -->
                <line x1="40" y1="0" x2="40" y2="45" stroke="#7a5c24" stroke-width="1.8" stroke-dasharray="4,3" />
                <!-- Bloom Mesh behind -->
                <circle cx="40" cy="85" r="38" fill="url(#lantern-halo-1)" class="lantern-glow-mesh" />
                <!-- Cap -->
                <path d="M28 45 L52 45 L48 55 L32 55 Z" fill="#9a7638" stroke="#caa558" stroke-width="1" />
                <circle cx="40" cy="42" r="3" fill="#caa558" />
                <!-- Glass Body -->
                <path d="M24 55 L56 55 L50 105 L30 105 Z" fill="rgba(12, 24, 28, 0.45)" stroke="#caa558" stroke-width="1.2" />
                <line x1="40" y1="55" x2="40" y2="105" stroke="#caa558" stroke-width="0.8" stroke-opacity="0.5" />
                <!-- Flame -->
                <g class="lantern-flame">
                  <circle cx="40" cy="85" r="15" fill="url(#lantern-flame-1)" />
                  <path d="M40 76 Q43 83 40 88 Q37 83 40 76 Z" fill="#fffdfa" />
                </g>
                <!-- Base -->
                <path d="M28 105 L52 105 L47 114 L33 114 Z" fill="#7a5c24" stroke="#caa558" stroke-width="1" />
              </svg>
            </div>
            <div class="lantern-info">
              <h3 class="lantern-title">Ongoing charity</h3>
              <p class="lantern-term">(sadaqah jariyah)</p>
              <p class="lantern-detail">Every act of kindness or good done in his name reaches him.</p>
              <span class="lantern-tap-hint">Tap to light</span>
            </div>
          </button>

          <!-- Lantern 2: Knowledge that Benefits -->
          <button type="button" class="lantern-card" id="lantern-knowledge" aria-pressed="false" aria-label="Light lantern for knowledge that benefits others">
            <div class="lantern-svg-wrap" aria-hidden="true">
              <svg class="lantern-svg" viewBox="0 0 80 150">
                <!-- Chain -->
                <line x1="40" y1="0" x2="40" y2="45" stroke="#7a5c24" stroke-width="1.8" stroke-dasharray="4,3" />
                <!-- Bloom Mesh behind -->
                <circle cx="40" cy="85" r="38" fill="url(#lantern-halo-1)" class="lantern-glow-mesh" />
                <!-- Cap -->
                <path d="M28 45 L52 45 L48 55 L32 55 Z" fill="#9a7638" stroke="#caa558" stroke-width="1" />
                <circle cx="40" cy="42" r="3" fill="#caa558" />
                <!-- Glass Body -->
                <path d="M24 55 L56 55 L50 105 L30 105 Z" fill="rgba(12, 24, 28, 0.45)" stroke="#caa558" stroke-width="1.2" />
                <line x1="40" y1="55" x2="40" y2="105" stroke="#caa558" stroke-width="0.8" stroke-opacity="0.5" />
                <!-- Flame -->
                <g class="lantern-flame">
                  <circle cx="40" cy="85" r="15" fill="url(#lantern-flame-1)" />
                  <path d="M40 76 Q43 83 40 88 Q37 83 40 76 Z" fill="#fffdfa" />
                </g>
                <!-- Base -->
                <path d="M28 105 L52 105 L47 114 L33 114 Z" fill="#7a5c24" stroke="#caa558" stroke-width="1" />
              </svg>
            </div>
            <div class="lantern-info">
              <h3 class="lantern-title">Knowledge that benefits</h3>
              <p class="lantern-term">('ilm yuntafa'u bihi)</p>
              <p class="lantern-detail">Every person he guided, taught, or inspired leaves enduring light.</p>
              <span class="lantern-tap-hint">Tap to light</span>
            </div>
          </button>

          <!-- Lantern 3: Righteous Child Praying -->
          <button type="button" class="lantern-card" id="lantern-child" aria-pressed="false" aria-label="Light lantern for a righteous child who prays for him">
            <div class="lantern-svg-wrap" aria-hidden="true">
              <svg class="lantern-svg" viewBox="0 0 80 150">
                <!-- Chain -->
                <line x1="40" y1="0" x2="40" y2="45" stroke="#7a5c24" stroke-width="1.8" stroke-dasharray="4,3" />
                <!-- Bloom Mesh behind -->
                <circle cx="40" cy="85" r="38" fill="url(#lantern-halo-1)" class="lantern-glow-mesh" />
                <!-- Cap -->
                <path d="M28 45 L52 45 L48 55 L32 55 Z" fill="#9a7638" stroke="#caa558" stroke-width="1" />
                <circle cx="40" cy="42" r="3" fill="#caa558" />
                <!-- Glass Body -->
                <path d="M24 55 L56 55 L50 105 L30 105 Z" fill="rgba(12, 24, 28, 0.45)" stroke="#caa558" stroke-width="1.2" />
                <line x1="40" y1="55" x2="40" y2="105" stroke="#caa558" stroke-width="0.8" stroke-opacity="0.5" />
                <!-- Flame -->
                <g class="lantern-flame">
                  <circle cx="40" cy="85" r="15" fill="url(#lantern-flame-1)" />
                  <path d="M40 76 Q43 83 40 88 Q37 83 40 76 Z" fill="#fffdfa" />
                </g>
                <!-- Base -->
                <path d="M28 105 L52 105 L47 114 L33 114 Z" fill="#7a5c24" stroke="#caa558" stroke-width="1" />
              </svg>
            </div>
            <div class="lantern-info">
              <h3 class="lantern-title">A righteous child</h3>
              <p class="lantern-term">(walad salih yad'u lahu)</p>
              <p class="lantern-detail">Your du'a is his enduring light. Whenever you pray for him, it reaches him.</p>
              <span class="lantern-tap-hint">Tap to light</span>
            </div>
          </button>
        </div>

        <!-- Revealed Hadith Container (Fades in softly when all 3 lanterns are lit) -->
        <article class="revealed-hadith-block" id="revealed-hadith" aria-live="polite">
          <p id="hadith-three-arabic" class="sacred-arabic" lang="ar" dir="rtl"></p>
          <p id="hadith-three-translation" class="sacred-translation"></p>
          <span id="hadith-three-reference" class="sacred-reference"></span>
        </article>

        <!-- Continue Nav -->
        <div class="continue-nav">
          <button type="button" class="continue-btn" onclick="document.getElementById('chapter-4').scrollIntoView({behavior: 'smooth'})" aria-label="Continue to Sabr">
            <span>Continue</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59L12 13.17L16.59 8.59L18 10L12 16L6 10L7.41 8.59Z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ====================================================================
         CHAPTER 4: Sabr (The Quiet Room)
         ==================================================================== -->
    <section class="chapter" id="chapter-4" aria-label="Chapter 4: Sabr">
      <!-- Breathing Cue Text (fades in once gently, then softly fades out) -->
      <span class="breathing-cue-text" id="sabr-cue" aria-hidden="true">breathe with the light</span>

      <!-- 8-Fold Geometric Star SVG (slowly expands ~4s, contracts ~6s) -->
      <div class="sabr-star-container" aria-hidden="true">
        <svg class="sabr-star-svg" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="star-gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffd98c" stop-opacity="0.8" />
              <stop offset="50%" stop-color="#caa558" stop-opacity="0.4" />
              <stop offset="100%" stop-color="#8a6729" stop-opacity="0.2" />
            </linearGradient>
          </defs>
          <!-- Outer Geometric Circle with Tick Accents -->
          <circle cx="200" cy="200" r="185" stroke="url(#star-gold-gradient)" stroke-width="0.8" stroke-dasharray="2,6" />
          <circle cx="200" cy="200" r="172" stroke="url(#star-gold-gradient)" stroke-width="0.6" stroke-opacity="0.5" />

          <!-- Rub el Hizb: Square 1 -->
          <rect x="75" y="75" width="250" height="250" stroke="url(#star-gold-gradient)" stroke-width="1.2" />
          <!-- Square 2 (Rotated 45 degrees) -->
          <rect x="75" y="75" width="250" height="250" transform="rotate(45 200 200)" stroke="url(#star-gold-gradient)" stroke-width="1.2" />

          <!-- Interlacing 8-Pointed Star Rosette -->
          <polygon points="360.0,200.0 283.1,234.4 313.1,313.1 234.4,283.1 200.0,360.0 165.6,283.1 86.9,313.1 116.9,234.4 40.0,200.0 116.9,165.6 86.9,86.9 165.6,116.9 200.0,40.0 234.4,116.9 313.1,86.9 283.1,165.6"
                   stroke="url(#star-gold-gradient)" stroke-width="1.2" fill="none" />

          <!-- Inner Geometric Diamond Structure -->
          <polygon points="200,85 315,200 200,315 85,200" stroke="url(#star-gold-gradient)" stroke-width="0.7" stroke-opacity="0.4" />
          <polygon points="200,85 315,200 200,315 85,200" transform="rotate(45 200 200)" stroke="url(#star-gold-gradient)" stroke-width="0.7" stroke-opacity="0.4" />

          <!-- Center Delicate 8-Pointed Core -->
          <circle cx="200" cy="200" r="32" stroke="url(#star-gold-gradient)" stroke-width="0.9" />
          <circle cx="200" cy="200" r="12" stroke="url(#star-gold-gradient)" stroke-width="0.6" fill="rgba(230, 184, 92, 0.05)" />
        </svg>
      </div>

      <!-- Sabr Verses Carousel Stage -->
      <div class="chapter-inner">
        <div class="sabr-stage" id="sabr-stage" role="region" aria-label="Verses of Patience and Solace" aria-roledescription="carousel">
          <!-- Slide items injected dynamically from sacred-text.json -->
        </div>

        <!-- Navigation Controls -->
        <div class="sabr-nav-controls">
          <button type="button" class="sabr-nav-btn" id="sabr-prev-btn" aria-label="Previous verse">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41L14 6L8 12L14 18L15.41 16.59L10.83 12L15.41 7.41Z"/></svg>
          </button>

          <div class="sabr-dots-indicator" id="sabr-dots" aria-hidden="true">
            <!-- 5 Dots injected dynamically -->
          </div>

          <button type="button" class="sabr-nav-btn" id="sabr-next-btn" aria-label="Next verse">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6L8.59 7.41L13.17 12L8.59 16.59L10 18L16 12L10 6Z"/></svg>
          </button>
        </div>

        <!-- Continue Nav -->
        <div class="continue-nav">
          <button type="button" class="continue-btn" onclick="document.getElementById('chapter-5').scrollIntoView({behavior: 'smooth'})" aria-label="Continue to du'a">
            <span>Continue</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59L12 13.17L16.59 8.59L18 10L12 16L6 10L7.41 8.59Z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ====================================================================
         CHAPTER 5: Du'a for Him
         ==================================================================== -->
    <section class="chapter" id="chapter-5" aria-label="Chapter 5: Du'a for Him">
      <!-- Du'a Sky Canvas holding all Ameen stars -->
      <div class="dua-sky-container" aria-hidden="true">
        <canvas class="dua-sky-canvas" id="dua-sky-canvas"></canvas>
      </div>

      <div class="chapter-inner">
        <!-- Du'a for the Deceased -->
        <article class="dua-card">
          <p id="ch5-deceased-arabic" class="sacred-arabic" lang="ar" dir="rtl"></p>
          <p id="ch5-deceased-transliteration" class="sacred-transliteration"></p>
          <p id="ch5-deceased-translation" class="sacred-translation"></p>
          <span id="ch5-deceased-reference" class="sacred-reference"></span>
        </article>

        <!-- Ameen Button -->
        <div class="ameen-button-wrap">
          <button type="button" class="ameen-button" id="ameen-btn" aria-label="Say Ameen and release a light for Dadyy">
            <span class="ameen-arabic-label" lang="ar" dir="rtl">آمِينَ</span>
            <span class="ameen-latin-label">Ameen</span>
          </button>
          <span class="ameen-hint">Tap Ameen to release a light into the sky for him</span>
        </div>

        <div class="dua-bereaved-divider" aria-hidden="true"></div>

        <!-- Du'a for the Bereaved -->
        <article class="dua-card">
          <p id="ch5-bereaved-arabic" class="sacred-arabic" lang="ar" dir="rtl"></p>
          <p id="ch5-bereaved-transliteration" class="sacred-transliteration"></p>
          <p id="ch5-bereaved-translation" class="sacred-translation"></p>
          <span id="ch5-bereaved-reference" class="sacred-reference"></span>
        </article>

        <!-- Continue Nav -->
        <div class="continue-nav">
          <button type="button" class="continue-btn" onclick="document.getElementById('chapter-6').scrollIntoView({behavior: 'smooth'})" aria-label="Continue to dawn">
            <span>Continue</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59L12 13.17L16.59 8.59L18 10L12 16L6 10L7.41 8.59Z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ====================================================================
         CHAPTER 6: Dawn
         ==================================================================== -->
    <section class="chapter" id="chapter-6" aria-label="Chapter 6: Dawn">
      <!-- Silhouette of the Kashmir Valley at Dawn SVG -->
      <div class="kashmir-landscape-wrap" aria-hidden="true">
        <svg class="kashmir-svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMax slice" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="kashmir-snow-glow" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fff1d0" stop-opacity="0.55" />
              <stop offset="50%" stop-color="#d9a56e" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#543736" stop-opacity="0.1" />
            </linearGradient>
            <linearGradient id="kashmir-mountains-back" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#1f1e2c" />
              <stop offset="100%" stop-color="#0a0f18" />
            </linearGradient>
            <linearGradient id="kashmir-foothills" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#141822" />
              <stop offset="100%" stop-color="#06090f" />
            </linearGradient>
            <linearGradient id="kashmir-mist" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#f6dfb8" stop-opacity="0.18" />
              <stop offset="100%" stop-color="#0a0f18" stop-opacity="0" />
            </linearGradient>
          </defs>

          <!-- Layer 1: Distant Himalayan Snow-Capped Peaks -->
          <path d="M 0 350 L 110 270 L 190 310 L 310 230 L 400 275 L 520 185 L 610 240 L 730 195 L 840 255 L 970 170 L 1090 260 L 1200 205 L 1200 480 L 0 480 Z"
                fill="url(#kashmir-mountains-back)" />
